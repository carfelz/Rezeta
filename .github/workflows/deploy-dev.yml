name: Deploy to Dev

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: medical-erp-dev
  REGION: southamerica-east1
  SERVICE_NAME: medical-erp-api
  REPOSITORY: medical-erp

jobs:
  ci:
    name: Lint, typecheck & test coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @rezeta/db generate

      - name: Build shared package
        run: pnpm --filter @rezeta/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage (≥95% threshold)
        run: pnpm test:coverage

  deploy-api:
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @rezeta/db generate

      # Keyless auth via Workload Identity Federation — no long-lived SA key.
      # Pool/provider/SA are created by scripts/setup-wif.sh; the two repo
      # variables hold the provider resource name and the SA email.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # Migrations run BEFORE Cloud Run deploy so a bad migration aborts
      # the deployment and leaves the running service on the correct schema.
      - name: Run Database Migrations
        run: |
          DATABASE_URL=$(gcloud secrets versions access latest --secret=database_url)
          DIRECT_URL=$(gcloud secrets versions access latest --secret=direct_url)
          export DATABASE_URL DIRECT_URL
          pnpm --filter @rezeta/db exec prisma migrate deploy

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest \
            -f apps/api/Dockerfile \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 60 \
            --set-env-vars NODE_ENV=production \
            --set-secrets DATABASE_URL=database_url:latest,FIREBASE_ADMIN_KEY=firebase-admin-key:latest,ALLOWED_ORIGINS=allowed_origins:latest

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [ci, deploy-api]

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @rezeta/shared build

      - name: Build frontend
        env:
          # VITE_API_URL is deliberately NOT set: the app then calls relative
          # /v1/... paths, which Firebase Hosting rewrites to Cloud Run
          # same-origin (no CORS).
          # Firebase web config is public (it ships in the client bundle), so
          # these live as repo variables, not secrets. All five are required by
          # apps/web/src/lib/auth/firebase-auth-client.ts.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          cd apps/web
          pnpm build

      # firebase.json (repo root) defines three hosting targets (app-dev,
      # api-dev, staff-dev — mapped to sites in .firebaserc); --only hosting
      # deploys all of them. firebase-tools picks up the credentials that the
      # auth step exported via GOOGLE_APPLICATION_CREDENTIALS.
      - name: Deploy to Firebase Hosting
        run: |
          # firebase-tools finalizes the new hosting version and effectively
          # releases it; the follow-up release call then returns
          # "400 ... is the current active version". The upload/release has
          # already succeeded at that point, so treat that specific message as
          # success instead of failing the job.
          set +e
          out=$(npx -y firebase-tools deploy \
            --only hosting \
            --project "${{ env.PROJECT_ID }}" \
            --non-interactive \
            --force 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ] && grep -q "is the current active version" <<<"$out"; then
            echo "Hosting is already at this version — treating as success."
            exit 0
          fi
          exit $code

      - name: Output URLs
        run: |
          echo "Deployment complete!"
          echo "App:   https://app-dev.rezeta.co"
          echo "API:   https://api-dev.rezeta.co"
          echo "Staff: https://staff-dev.rezeta.co"
