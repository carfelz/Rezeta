name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci:
    name: Lint, typecheck & test coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @rezeta/db generate

      - name: Build shared package
        run: pnpm --filter @rezeta/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage (≥90% threshold)
        run: pnpm test:coverage

  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest

    env:
      # Every *.int-spec.ts suite is guarded by hasTestDb(), which requires
      # TEST_DATABASE_URL — without it the whole integration suite silently
      # skips (apps/api/src/test/db-test-utils.ts).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rezeta_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rezeta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @rezeta/db generate

      - name: Build shared package
        run: pnpm --filter @rezeta/shared build

      - name: Apply migrations
        run: pnpm --filter @rezeta/db migrate:deploy
        env:
          # The Prisma schema requires both url and directUrl at CLI time.
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Integration tests
        run: pnpm --filter @rezeta/api test:integration
